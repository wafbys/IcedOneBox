# cbindgen 配置：由 build.rs 调用，从 crates/onebox-ffi 生成 include/onebox.h。
language = "C"
include_guard = "ONEBOX_H"
autogen_warning = "/* 此文件由 cbindgen 自动生成，请勿手动编辑。 */"
header = "/* IcedOneBox 核 C ABI 头文件 */"
documentation = true
documentation_style = "doxy"
cpp_compat = true
line_length = 100
tab_width = 4
usize_is_size_t = true

[enum]
# 变体名已在 Rust 中写成大写下划线形式，无需再改。
prefix_with_name = false
