# cbindgen 配置：由 crates/onebox-terminal/build.rs 调用，
# 生成 include/onebox_terminal.h。
#
# 终端是独立模块，头文件（含 include_guard）与核的 onebox.h 完全分开，
# 避免两者并存时同名类型互相打架。
language = "C"
include_guard = "ONEBOX_TERMINAL_H"
autogen_warning = "/* 此文件由 cbindgen 自动生成，请勿手动编辑。 */"
header = "/* IcedOneBox 终端模块 C ABI 头文件 */"
documentation = true
documentation_style = "doxy"
cpp_compat = true
line_length = 100
tab_width = 4
usize_is_size_t = true

[enum]
# 变体名已在 Rust 中写成大写下划线形式，无需再改。
prefix_with_name = false
